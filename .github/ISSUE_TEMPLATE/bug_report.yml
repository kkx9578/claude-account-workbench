name: Bug report / 问题反馈
description: Report a reproducible issue without account secrets.
body:
  - type: markdown
    attributes:
      value: '请勿上传 Cookie、令牌、state.json、Claude 配置或完整登录目录。安全问题请使用本仓库的私密漏洞报告入口。'
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: Workbench version, Windows version, and Claude Desktop version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result / 操作步骤和期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / 实际结果
      description: Redact email addresses and secrets from any screenshot or log excerpt.
    validations:
      required: true
